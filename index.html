<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2024">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cassette Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme: dark;
  --bg:#0E151C; --panel:#17212B; --ink:#E8EEF4; --muted:#93A1B0; --line:#263341;
  --accent:#52C5BF; --on-accent:#08201F; --warn:#F2917A;
  --font:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none !important}
html{font-size:clamp(15px, 1.15vmin + 10px, 22px)}
body{margin:0;height:100dvh;background:#1e2024;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}

/* ---------- forms, dialogs, toast ---------- */
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;min-height:2.7rem}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55rem .6rem;min-height:2.7rem}
dialog{border:0;border-radius:20px;padding:0;background:var(--panel);color:var(--ink);width:min(26rem,92vw);max-height:90dvh;overflow:auto;font-family:var(--font)}
dialog::backdrop{background:rgba(10,18,26,.65)}
.dlg{padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.dlg h3{font-size:1.25rem;font-weight:700}
.dlg h4{margin:0;font-size:1rem;font-weight:600;color:var(--ink)}
.dlg label{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;font-weight:600;color:var(--muted)}
.dlg input[readonly]{color:var(--muted);font-size:.85rem}
.sect{border-top:1px solid var(--line);padding-top:.8rem;display:flex;flex-direction:column;gap:.6rem}
.actions{display:flex;align-items:center;gap:.5rem;margin-top:.2rem}
.grow{flex:1}
.primary,.secondary,.danger{min-height:2.7rem;padding:0 1.1rem;border-radius:999px;font-weight:600}
.primary{background:var(--accent);color:var(--on-accent)}
.secondary{border:1px solid var(--line)}
.danger{color:var(--warn);padding:0 .5rem}
.hint{color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:30}

/* ---------- charcoal cassette deck faceplate ---------- */
.np{
  position:relative;
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:#e2e4e9;
  background:
    var(--grain,none),
    repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,rgba(0,0,0,.18) 1px 2px,rgba(255,255,255,.02) 2px 3px),
    linear-gradient(90deg,#1c1e22 0%,#2d3036 16%,#22252a 38%,#32363d 60%,#1f2226 84%,#282b30 100%);
}
.np-gear{
  position:absolute;top:.8rem;right:.8rem;z-index:5;
  width:2.6rem;height:2.6rem;border-radius:50%;
  background:linear-gradient(#34373d,#181a1d);
  color:#d8dce2;display:grid;place-items:center;
  box-shadow:0 2px 0 #0a0a0b,inset 0 1px 0 rgba(255,255,255,.18);
}
.faceplate{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:space-evenly;gap:1rem;padding:3.6rem 2.2rem calc(env(safe-area-inset-bottom, 0px) + 4.8rem)}

/* ---------- VU meters ---------- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.vu-mod{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.peak{display:flex;align-items:center;gap:.55rem;font:700 .7rem 'Instrument Sans',system-ui,sans-serif;letter-spacing:.16em;color:#b8bdc6}
.led{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a2a2a,#3a0c0c);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 0 0 2px #383b42,0 0 0 3px #16181b}
.led.on{background:radial-gradient(circle at 35% 30%,#ff9a8f,#ff2d1f);box-shadow:0 0 .7rem #ff3b30,0 0 0 2px #383b42,0 0 0 3px #16181b}
.vu{width:100%;height:auto;max-height:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.65))}
.vu-num{font-family:Georgia,'Times New Roman',serif;font-size:12px;fill:#1d1d1d}
.vu-big{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:38px;fill:#222;opacity:.8}
.vu-small{font-family:'Instrument Sans',system-ui,sans-serif;font-weight:700;font-size:11px;letter-spacing:.16em;fill:#222}

/* ---------- cassette bay & tape ---------- */
.bay{
  position:relative;padding:.6rem;border-radius:8px;
  background:linear-gradient(#383b42,#22252a 50%,#2c2f36);
  box-shadow:0 0 0 1px #141619,inset 0 1px 0 rgba(255,255,255,.14),0 8px 18px rgba(0,0,0,.55);
}
.bay-in{
  position:relative;border-radius:4px;
  background:linear-gradient(#0a0a0b,#141518 60%,#0a0b0d);
  box-shadow:inset 0 6px 14px rgba(0,0,0,.95),inset 0 0 0 1px #000;
  padding:2rem .5rem 1rem;
}
.bay-in::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1.5rem;
  background:linear-gradient(#454850,#202227);
  border-radius:4px 4px 0 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.cas{position:relative;isolation:isolate;width:86%;margin:0 auto;aspect-ratio:379/242}
.cas-plate{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));user-select:none;-webkit-user-drag:none}
.cas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cas .front,.cas .tint{pointer-events:none}
.cas .tint{mix-blend-mode:screen}
.cas-label{font-family:'Montserrat','Instrument Sans',system-ui,sans-serif;font-weight:700;fill:#f6f5f1;letter-spacing:.01em;text-transform:uppercase}
.spin{transform-box:fill-box;transform-origin:center;animation:reel 2.6s linear infinite;animation-play-state:paused}
.np.playing .spin{animation-play-state:running}
@keyframes reel{to{transform:rotate(-360deg)}}
.bay-foot{
  height:1.1rem;margin:.55rem -.1rem -.1rem;border-radius:3px;
  background:linear-gradient(#34373e,#1f2126);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px #141619;
  display:grid;place-items:center;
}
.bay-foot i{width:.6rem;height:.6rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#111);box-shadow:0 0 0 2px #2b2e34}

/* ---------- track readout & switches ---------- */
.info{display:flex;flex-direction:column;align-items:center;gap:.55rem}
.readout{display:flex;justify-content:center;align-items:center;gap:.75rem;flex-wrap:wrap}
.mic-sw{
  display:inline-flex;align-items:center;gap:.55rem;padding:.55rem .9rem;border-radius:4px;
  background:linear-gradient(#2e3137,#18191c);color:#e0e1e3;
  font:700 .72rem 'Instrument Sans',system-ui,sans-serif;letter-spacing:.16em;
  box-shadow:0 .22rem 0 #08090a,inset 0 1px 0 rgba(255,255,255,.18);min-height:2.6rem;
}
.mic-sw .led{width:.65rem;height:.65rem;background:#2a3a2a;box-shadow:none}
.mic-sw[aria-pressed="true"] .led{background:#47ff7a;box-shadow:0 0 .55rem #47ff7a}
.np-time{font:600 1.4rem/1 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:.08em;color:#f0c24f;background:#0b0c0e;border:1px solid #353840;border-radius:6px;padding:.35rem .8rem}
.np-track{color:#e6e8ec;font-size:.95rem;text-align:center;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vu-hint{color:#949aa4;font-size:.78rem;text-align:center;max-width:36rem}

/* ---------- charcoal mechanical transport keys ---------- */
.keys{display:flex;justify-content:center;gap:.55rem;padding:0;background:none;box-shadow:none;border-radius:0}
.keycol{display:flex;flex-direction:column;align-items:center;gap:.4rem}
.kl{margin:0;color:#b8bdc6;font:700 .68rem 'Instrument Sans',system-ui,sans-serif;letter-spacing:.14em;display:block;text-align:center}
.slot{padding:.3rem .3rem .55rem;border-radius:3px;background:linear-gradient(#050506,#1a1b1f);box-shadow:inset 0 3px 7px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.12)}
.key{
  width:4.1rem;height:4.4rem;border-radius:2px 2px 3px 3px;
  color:#e2e5ea;
  background:linear-gradient(#4a4e56 0%,#34373d 48%,#26282d 100%);
  border:1px solid #17181c;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 .4rem 0 #121316;
  display:grid;place-items:center;
  transition:transform .05s,box-shadow .05s;
}
.key:active,.key.latched{
  transform:translateY(.35rem);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 .05rem 0 #121316;
}
.key.latched{background:linear-gradient(#383b42,#222429);color:#f0c24f}
.key svg{width:1.5rem;height:1.5rem;fill:currentColor}
.key:disabled{opacity:.4}

@media (orientation:landscape){
  .faceplate{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr);grid-template-areas:"meters bay" "meters info" "meters keys";align-content:center;align-items:center;gap:.8rem 1.6rem;padding-top:1rem;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 4.2rem)}
  .meters{grid-area:meters;grid-template-columns:1fr}
  .bay{grid-area:bay}
  .info{grid-area:info;gap:.35rem}
  .keys{grid-area:keys}
  .bay-in{padding:2rem .5rem .7rem}
  .bay-in .cas{width:68%}
  .key{width:3.6rem;height:3.5rem}
}

/* ---------- deck: glass door over the cassette bay ---------- */
.glass{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;overflow:hidden;
  background:
    linear-gradient(112deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.06) 20%,rgba(255,255,255,0) 36%,rgba(255,255,255,0) 60%,rgba(255,255,255,.07) 72%,rgba(255,255,255,0) 84%),
    rgba(8,12,18,.24);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -14px 26px rgba(0,0,0,.28),inset 0 0 30px rgba(120,150,190,.06)}
.glass::after{content:"";position:absolute;left:10%;width:22%;top:-10%;bottom:-10%;transform:skewX(-18deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.05),rgba(255,255,255,0))}

/* ---------- variant switch ---------- */
.np-var{position:absolute;top:.8rem;left:.8rem;z-index:5;height:2.6rem;padding:0 1rem;border-radius:999px;background:linear-gradient(#34373d,#181a1d);color:#d8dce2;font:700 .72rem 'Instrument Sans',system-ui,sans-serif;letter-spacing:.14em;box-shadow:0 2px 0 #0a0a0b,inset 0 1px 0 rgba(255,255,255,.18)}

/* ---------- variant 2: Spotify-style player ---------- */
.np.v2{background:linear-gradient(180deg,var(--t1,#4a4d57) 0%,var(--t2,#1c1d22) 58%,#101012 100%)}
.np.v2 .np-gear,.np.v2 .np-var{display:none}
.player{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:1rem;padding:.9rem 2.2rem calc(env(safe-area-inset-bottom, 0px) + 4.8rem);color:#fff}
.pl-top{width:100%;display:grid;grid-template-columns:3rem 1fr 3rem;align-items:center}
.pl-icon{width:3rem;height:3rem;display:grid;place-items:center;color:#fff;border-radius:50%}
.pl-icon svg{width:1.7rem;height:1.7rem;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pl-where{text-align:center;min-width:0}
.pl-where span{display:block;font-size:.8rem;opacity:.85}
.pl-where b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem}
.pl-art{width:min(100%, 50dvh);aspect-ratio:1;border-radius:.75rem;background:rgba(255,255,255,.08) center/cover no-repeat;box-shadow:0 14px 40px rgba(0,0,0,.45);flex:none}
.pl-right{width:min(100%, 50dvh);display:flex;flex-direction:column;gap:.35rem}
.pl-meta{margin-bottom:.8rem}
.pl-title{font-size:1.9rem;font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-artist{font-size:1.2rem;opacity:.7;margin-top:.2rem}
.pl-seek{height:2.2rem;display:flex;align-items:center;touch-action:none;cursor:pointer}
.pl-bar{position:relative;width:100%;height:.28rem;border-radius:.2rem;background:rgba(255,255,255,.28)}
.pl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:.2rem;background:#fff;width:0}
.pl-bar b{position:absolute;top:50%;left:0;width:.95rem;height:.95rem;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pl-times{display:flex;justify-content:space-between;font-size:.85rem;opacity:.75}
.pl-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:.9rem}
.pl-btn{position:relative;width:3.4rem;height:3.4rem;display:grid;place-items:center;color:#fff;border-radius:50%}
.pl-btn svg{width:2.1rem;height:2.1rem;fill:currentColor}
.pl-btn.line svg{width:1.7rem;height:1.7rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl-btn.on{color:#1ed760}
.pl-btn[data-mode="track"]::after{content:"1";position:absolute;right:.55rem;top:.7rem;font:800 .6rem 'Instrument Sans',system-ui,sans-serif;color:#1ed760}
.pl-btn:disabled{opacity:.4}
.pl-play{width:5.2rem;height:5.2rem;background:#fff;color:#000}
.pl-play svg{width:2.4rem;height:2.4rem}
@media (orientation:landscape){
  .player{padding-left:2.4rem;padding-right:2.4rem;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 4.2rem)}
  .pl-main{flex-direction:row;gap:3rem}
  .pl-art{width:min(46dvh, 46%)}
  .pl-right{width:auto;flex:1;max-width:34rem}
}

/* ---------- raster artwork: background, bay frame, VU meters and keys ---------- */
.np{background:#1c1e22 url(deck-bg.webp) center/cover no-repeat}
.vu-box{position:relative;width:100%;aspect-ratio:300/190;border-radius:10px;box-shadow:0 6px 14px rgba(0,0,0,.6)}
.vu-box img,.vu-box svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bay{padding:0;border-style:solid;border-color:transparent;border-width:42px 20px 42px 20px;border-image:url(deck-bay.webp) 84 40 84 40 fill / 42px 20px 42px 20px stretch;background:none;box-shadow:0 10px 24px rgba(0,0,0,.5);border-radius:10px}
.bay-in{background:none;box-shadow:none;border-radius:0;padding:.5rem .3rem .3rem}
.bay-in::before,.bay-foot{display:none}
.bay-in .cas{width:87%}
.keycol{gap:0}
.key,.key:active,.key.latched{width:4.6rem;height:auto;aspect-ratio:192/276;padding:0;border:0;border-radius:0;box-shadow:none;transform:none;transition:none;color:inherit;
  background-color:transparent;background-image:url(deck-keys.webp);background-size:500% 300%;background-repeat:no-repeat;background-position-y:0%;-webkit-tap-highlight-color:transparent}
.key:active{background-position-y:50%}
.key.latched{background-position-y:100%}
#npPrev{background-position-x:0%}#npNext{background-position-x:25%}#npPlay{background-position-x:50%}#npPause{background-position-x:75%}#npEject{background-position-x:100%}
.key svg{display:none}
.key:disabled{opacity:.5}
.cas-label{paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:2.6px;stroke-linejoin:round}
.cas .artlay{mix-blend-mode:screen;pointer-events:none}
@media (orientation:landscape){
  .bay-in{padding:.4rem .3rem .3rem}
  .bay-in .cas{width:69%}
  .key,.key:active,.key.latched{width:4rem}
}

/* ---------- replaced artwork: supplied meter, key sheet and cassette photo ---------- */
.cas .tint{display:none}
.cas .artlay{mix-blend-mode:normal}
.vu-box{overflow:hidden}
.keys{gap:0;width:fit-content;max-width:100%;align-self:center;justify-self:center;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.7)}

/* ---------- cassette-change flaps (sit behind the glass) ---------- */
.flaps{position:absolute;inset:0;overflow:hidden;z-index:3;pointer-events:none}
.flap{position:absolute;left:0;right:0;height:50.8%;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,rgba(0,0,0,.22) 1px 7px),linear-gradient(rgba(6,7,9,.50),rgba(6,7,9,.74)),url(deck-bg.webp) center/cover no-repeat,#15171a;
  transition:transform .78s cubic-bezier(.65,.02,.25,1)}
.flap.top{top:0;transform:translateY(-103%);border-bottom:2px solid #040405;box-shadow:inset 0 -1px 0 rgba(255,255,255,.20),0 10px 18px rgba(0,0,0,.75)}
.flap.bot{bottom:0;transform:translateY(103%);border-top:2px solid #040405;box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 -10px 18px rgba(0,0,0,.75)}
.flaps.closed .flap.top,.flaps.closed .flap.bot{transform:translateY(0)}
@media (prefers-reduced-motion: reduce){ .flap{transition:none} }

/* ---------- subtler cassette text, tighter layout ---------- */
.cas-label{fill:rgba(244,243,238,.66);stroke:rgba(0,0,0,.30);stroke-width:1.4px;letter-spacing:.015em}
.faceplate{justify-content:flex-start;gap:0;padding-top:4.4rem;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 6rem)}
.meters{margin-bottom:2rem}
.bay{margin-bottom:.8rem}
.keys{margin-bottom:1.2rem}
.info{margin-bottom:0}
.mic-sw[aria-pressed="true"] .led{background:#6b5a22;box-shadow:none}
.mic-sw.live[aria-pressed="true"] .led{background:#47ff7a;box-shadow:0 0 .55rem #47ff7a}
@media (orientation:landscape){
  .faceplate{padding-top:3.4rem;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 4.4rem)}
  .meters,.bay,.info,.keys{margin-bottom:0}
  .faceplate{grid-template-areas:"meters bay" "meters keys" "meters info"}
}
</style>
</head>
<body>

<!--
  SETUP FOR SPOTIFY:
  1. At developer.spotify.com/dashboard, create an app and tick "Web API".
  2. Add the Redirect URI shown in Connections (it is the address where this file is hosted, https).
  3. Open Connections (gear button or EJECT key) and paste the app's client ID there (saved on this device only).
  Playback control needs Spotify Premium.
-->

<main id="npDlg" class="np" aria-label="Now playing">
  <button id="openSettings" class="np-gear" aria-label="Spotify and device settings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h9M19 7h1M4 12h3M13 12h7M4 17h9M19 17h1"/>
      <circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="17" r="2"/>
    </svg>
  </button>

  <button id="toPlayer" class="np-var" aria-label="Switch to the Spotify-style player">PLAYER</button>

  <div id="deck" class="faceplate">
    <div class="meters">
      <div class="vu-mod"><div class="peak"><i id="pkL" class="led"></i><span>PEAK</span></div><div class="vu-box" role="img" aria-label="Low pitch level meter"><img src="vu-face-low.webp" alt=""><svg id="vuL" aria-hidden="true"></svg></div></div>
      <div class="vu-mod"><div class="peak"><i id="pkR" class="led"></i><span>PEAK</span></div><div class="vu-box" role="img" aria-label="High pitch level meter"><img src="vu-face-high.webp" alt=""><svg id="vuR" aria-hidden="true"></svg></div></div>
    </div>

    <div class="bay">
      <div class="bay-in">
        <div id="cas" class="cas" role="img" aria-label="Cassette tape">
          <img class="cas-plate" src="cassette-plate.webp" alt="" draggable="false">

          <!-- album art laid over the label (not over the window) -->
          <svg class="artlay" viewBox="0 0 379 242" aria-hidden="true">
            <defs>
              <clipPath id="casOut"><path clip-rule="evenodd" d="M23.5 65.5 H352 L357 70.5 V206.5 L340 223.5 H35.5 L18.5 206.5 V70.5 Z M60 101 H319 L326 108 V160 L319 167 H60 L53 160 V108 Z"/></clipPath>
              <linearGradient id="artScrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".72"/><stop offset=".3" stop-color="#000" stop-opacity=".24"/><stop offset=".68" stop-color="#000" stop-opacity=".24"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></linearGradient>
            </defs>
            <g clip-path="url(#casOut)">

<script>
/* ================= settings & storage ================= */
const SPOTIFY_CLIENT_ID = "";  // optional: or paste the ID under Connections on the device instead
const SPOTIFY_SCOPE = "user-read-playback-state user-modify-playback-state user-read-currently-playing";

const mem = {};
const store = {
  get(k, d){
    try{ const v = localStorage.getItem("board:"+k); if(v !== null) return JSON.parse(v); }catch(e){}
    return (k in mem) ? mem[k] : d;
  },
  set(k, v){
    mem[k] = v;
    try{ localStorage.setItem("board:"+k, JSON.stringify(v)); }catch(e){}
  }
};
const spCid = () => SPOTIFY_CLIENT_ID || store.get("spClientId", "");

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const vib = ms => { try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} };
const fmtMs = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + pad(s % 60); };

function h(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === "class") e.className = v;
    else if(k.startsWith("on")) e[k] = v;
    else if(v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? "" : v);
  }
  e.append(...kids.filter(x => x !== null && x !== undefined && x !== false));
  return e;
}

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4000);
}

/* keep the screen on for a wall display */
async function keepAwake(){
  try{ if("wakeLock" in navigator && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", keepAwake);
addEventListener("pointerdown", keepAwake, {once:true});
keepAwake();

/* ================= Spotify remote control ================= */
const SP_TOKEN_URL = "https://accounts.spotify.com/api/token";
const spRedirect = () => location.origin + location.pathname;
let sp = store.get("spTokens", null);   // {access, refresh, exp}
let spNow = null, spDevices = [], spTick = 0;

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

async function spLogin(){
  if(!spCid()){ toast("Paste your Spotify client ID first."); return; }
  if(!(window.crypto && crypto.subtle)){ toast("Spotify sign-in needs a secure (https) address."); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  store.set("spVerifier", verifier);
  const q = new URLSearchParams({
    client_id: spCid(), response_type:"code", redirect_uri: spRedirect(),
    scope: SPOTIFY_SCOPE, code_challenge_method:"S256", code_challenge: challenge, state:"spotify"
  });
  location.href = "https://accounts.spotify.com/authorize?" + q;
}

function spSaveTokens(t){
  sp = { access: t.access_token, refresh: t.refresh_token || (sp && sp.refresh), exp: Date.now() + (Number(t.expires_in||3600) - 60) * 1000 };
  store.set("spTokens", sp);
}

async function spHandleRedirect(){
  const p = new URLSearchParams(location.search);
  if(p.get("state") !== "spotify" || !(p.get("code") || p.get("error"))) return;
  history.replaceState({}, "", location.pathname);
  if(p.get("error")){ toast("Spotify sign-in was cancelled."); return; }
  try{
    const res = await fetch(SP_TOKEN_URL, {
      method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body: new URLSearchParams({client_id:spCid(), grant_type:"authorization_code", code:p.get("code"), redirect_uri:spRedirect(), code_verifier:store.get("spVerifier","")})
    });
    if(!res.ok) throw new Error(String(res.status));
    spSaveTokens(await res.json());
    toast("Spotify connected.");
  }catch(e){ toast("Spotify sign-in failed. Check the client ID and redirect URI."); }
}

function spDisconnect(){
  sp = null; spNow = null; spDevices = [];
  store.set("spTokens", null);
  npRender(); refreshSettings();
}

async function spToken(){
  if(!sp) return null;
  if(Date.now() < sp.exp) return sp.access;
  try{
    const res = await fetch(SP_TOKEN_URL, {
      method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body: new URLSearchParams({grant_type:"refresh_token", refresh_token:sp.refresh, client_id:spCid()})
    });
    if(res.status === 400 || res.status === 401){ spDisconnect(); toast("Spotify sign-in expired. Connect again in settings."); return null; }
    if(!res.ok) return null;
    spSaveTokens(await res.json());
    return sp.access;
  }catch(e){ return null; }
}

async function spApi(method, path, body){
  const t = await spToken();
  if(!t) return {status:0};
  try{
    const res = await fetch("https://api.spotify.com/v1" + path, {
      method, headers: Object.assign({Authorization:"Bearer "+t}, body ? {"Content-Type":"application/json"} : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    let data = null;
    if(res.status !== 204){ try{ data = await res.json(); }catch(e){} }
    return {status:res.status, data};
  }catch(e){ return {status:0}; }
}

async function spDevicesRefresh(){
  const r = await spApi("GET", "/me/player/devices");
  if(r.status === 200 && r.data) spDevices = r.data.devices || [];
  renderDevices();
}

async function spPoll(){
  if(!sp || document.visibilityState !== "visible") return;
  const r = await spApi("GET", "/me/player");
  if(r.status === 200 && r.data && r.data.item){
    const it = r.data.item, imgs = ((it.album || it.show || {}).images) || [];
    spNow = {
      playing: !!r.data.is_playing, title: it.name || "",
      artist: (it.artists || []).map(a => a.name).join(", ") || (it.show && it.show.publisher) || "",
      art: (imgs[1] || imgs[0] || {}).url || "", artBig: (imgs[0] || {}).url || "",
      album: (it.album && it.album.name) || (it.show && it.show.name) || "", dur: it.duration_ms || 0,
      pos: r.data.progress_ms || 0, at: Date.now(),
      device: (r.data.device && r.data.device.name) || "", shuffle: !!r.data.shuffle_state, repeat: r.data.repeat_state || "off"
    };
  }else if(r.status === 200 || r.status === 204){
    spNow = null;
  }
  if(sp && (spTick++ % 3 === 0 || !spNow)) await spDevicesRefresh();
  npRender();
}

function renderDevices(){
  const sel = $("mDev");
  if(document.activeElement === sel) return;
  const sig = spDevices.map(d => d.id + d.is_active).join("|");
  if(sel.dataset.sig === sig) return;
  sel.dataset.sig = sig;
  sel.innerHTML = "";
  if(!spDevices.length){ sel.append(h("option",{value:""}, "No active Spotify devices found")); sel.disabled = true; return; }
  sel.disabled = false;
  if(!spDevices.some(d => d.is_active)) sel.append(h("option",{value:""}, "Play on..."));
  spDevices.forEach(d => sel.append(h("option",{value:d.id, selected:d.is_active}, d.name)));
}

function spError(r){
  if(r.status === 403) toast("Playback control needs Spotify Premium.");
  else if(r.status === 404) toast("No active Spotify device. Open settings to pick one.");
  else if(r.status === 401) toast("Spotify sign-in expired. Reconnect in settings.");
  else if(r.status === 0 || r.status >= 400) toast("Couldn't reach Spotify.");
}

async function spControl(action){
  let r;
  if(action === "toggle"){
    const playing = !!(spNow && spNow.playing);
    if(spNow){ spNow.pos += playing ? Date.now() - spNow.at : 0; spNow.at = Date.now(); spNow.playing = !playing; npRender(); }
    r = await spApi("PUT", playing ? "/me/player/pause" : "/me/player/play");
  }else{
    r = await spApi("POST", action === "next" ? "/me/player/next" : "/me/player/previous");
  }
  if(r.status >= 400 || r.status === 0) spError(r);
  setTimeout(spPoll, 700);
}

/* ================= settings dialog ================= */
function refreshSettings(){
  $("devSect").hidden = !sp;
  $("spStatus").textContent = !spCid() ? "Paste your Spotify client ID below, then tap Connect Spotify."
    : sp ? "Connected. Playback control needs Spotify Premium." : "Not connected.";
  $("spConn").textContent = sp ? "Reconnect" : "Connect Spotify";
  $("spDisc").hidden = !sp;
  renderDevices();
}

function openSettings(){
  $("spCid").value = spCid();
  $("spRedirect").value = spRedirect();
  if(sp) spDevicesRefresh();
  refreshSettings();
  $("setDlg").showModal();
}

$("openSettings").onclick = openSettings;
$("setClose").onclick = () => $("setDlg").close();
function saveSpCid(){
  if(SPOTIFY_CLIENT_ID) return true;
  const v = $("spCid").value.trim();
  if(!/^[a-f0-9]{32}$/i.test(v)){ toast("That doesn't look like a Spotify client ID (32 letters and numbers)."); return false; }
  store.set("spClientId", v);
  return true;
}
$("spConn").onclick = () => { if(saveSpCid()) spLogin(); };
$("spDisc").onclick = spDisconnect;
$("mDev").onchange = async e => {
  if(!e.target.value) return;
  const r = await spApi("PUT", "/me/player", {device_ids:[e.target.value], play:true});
  if(r.status >= 400 || r.status === 0) spError(r);
  setTimeout(spPoll, 800);
};
$("mDev").addEventListener("pointerdown", spDevicesRefresh);

/* ================= cassette and VU meters ================= */
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; };
let npArtShown = null, npTapeKey = null;

/* cassette shell colour is picked from the cover art */
const tintCache = {};
function artTint(url){
  if(!url) return Promise.resolve(null);
  if(url in tintCache) return Promise.resolve(tintCache[url]);
  return new Promise(resolve => {
    const done = c => { tintCache[url] = c; resolve(c); };
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onerror = () => done(null);
    im.onload = () => {
      try{
        const n = 16, cv = document.createElement("canvas"); cv.width = cv.height = n;
        const cx = cv.getContext("2d"); cx.drawImage(im, 0, 0, n, n);
        const d = cx.getImageData(0, 0, n, n).data;
        const buckets = Array.from({length:12}, () => ({w:0, r:0, g:0, b:0}));
        let ar = 0, ag = 0, ab = 0, cnt = 0;
        for(let i = 0; i < d.length; i += 4){
          const r = d[i], g = d[i+1], b = d[i+2];
          const mx = Math.max(r,g,b), mn = Math.min(r,g,b), dd = mx - mn;
          ar += r; ag += g; ab += b; cnt++;
          const s = mx ? dd / mx : 0;
          if(s < .15) continue;
          let hue;
          if(mx === r) hue = ((g - b) / dd) % 6; else if(mx === g) hue = (b - r) / dd + 2; else hue = (r - g) / dd + 4;
          const k = Math.floor(((hue + 6) % 6) * 2) % 12, w = s * (mx / 255), bk = buckets[k];
          bk.w += w; bk.r += r * w; bk.g += g * w; bk.b += b * w;
        }
        const best = buckets.reduce((a, b) => b.w > a.w ? b : a, buckets[0]);
        let r, g, b;
        if(best.w > .5){ r = best.r / best.w; g = best.g / best.w; b = best.b / best.w; }
        else{ r = ar / cnt; g = ag / cnt; b = ab / cnt; }
        const mix = .62, base = 28;
        done(`rgb(${Math.round(r*mix+base)},${Math.round(g*mix+base)},${Math.round(b*mix+base)})`);
      }catch(e){ done(null); }
    };
    im.src = url;
  });
}

const hashStr = s => { let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function wavePath(x0, x1, cy, rnd, lobes, base, step){
  const pts = [], n = Math.max(4, Math.round((x1 - x0) / step));
  for(let i = 0; i <= n; i++){
    const t = i / n;
    let env = base;
    for(const [c, a, wd] of lobes) env += a * Math.exp(-Math.pow((t - c) / wd, 2));
    const amp = Math.min(38, 1.9 * env * (0.7 + 0.3 * rnd()));
    pts.push([x0 + (x1 - x0) * t, cy + (i % 2 ? -amp : amp)]);
  }
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i = 1; i < pts.length - 1; i++){
    const mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
    d += ` Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
}

function labelColor(c){
  const m = c && c.match(/\d+/g);
  if(!m) return "#000";
  return `rgb(${Math.round(m[0] * .4)},${Math.round(m[1] * .4)},${Math.round(m[2] * .4)})`;
}

function fitSvgText(el, text, maxW, size, min){
  el.textContent = text; el.setAttribute("font-size", size);
  let w = el.getComputedTextLength ? el.getComputedTextLength() : 0;
  if(w > maxW){ el.setAttribute("font-size", Math.max(min, size * maxW / w).toFixed(1)); w = el.getComputedTextLength(); }
  let t = text;
  while(w > maxW + .5 && t.length > 4){ t = t.slice(0, -2).trimEnd(); el.textContent = t + "..."; w = el.getComputedTextLength(); }
  return w;
}

function casDesign(artist, album, title){
  const a = (artist || "").trim(), b = (album || "").trim(), t = (title || "").trim();
  const wb = fitSvgText($("casAlbum"), b, 130, 18.5, 11);
  fitSvgText($("casArtist"), a, 310 - (b ? wb + 22 : 0), 18.5, 11);
  fitSvgText($("casTitle"), t, 300, 19.5, 12);
}

function setPack(side, r){
  const c = $("casPack" + side), ring = $("casRing" + side);
  c.setAttribute("r", ((r + 22) / 2).toFixed(2));
  c.setAttribute("stroke-width", Math.max(.01, r - 22).toFixed(2));
  ring.setAttribute("r", r.toFixed(2));
  ring.setAttribute("stroke-opacity", r > 22.5 ? ".25" : "0");
}

/* ================= cassette change: dark metal flaps close, the tape is swapped, then they open again ================= */
let tapeSwap = false, micBusy = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

function applyTape(){
  const connected = !!sp, has = !!spNow;
  const art = has ? (spNow.artBig || spNow.art || "") : "";
  npArtShown = art;
  const ca = $("casArt"); if(art) ca.setAttribute("href", art); else ca.removeAttribute("href");
  artTint(art).then(c => { if(art === npArtShown){ $("casShell").setAttribute("fill", labelColor(c)); setPlayerTint(c); } });
  npTapeKey = has ? (spNow.album + "|" + spNow.title) : (connected ? "empty" : "off");
  casDesign(has ? spNow.artist : "", has ? spNow.album : "", has ? spNow.title : (connected ? "No tape loaded" : "Not connected"));
}

async function changeTape(){
  tapeSwap = true;
  const fl = $("flaps");
  fl.classList.add("closed"); vib(20);
  await sleep(780);                                   // the flaps meet in the middle
  applyTape();                                        // swap the cassette while it is hidden
  await sleep(320);
  const t0 = Date.now();
  while(!(spNow && spNow.playing) && Date.now() - t0 < 4000) await sleep(150);   // open once the new song is playing
  fl.classList.remove("closed");
  await sleep(780);
  tapeSwap = false;
  npRender();
}

/* the microphone only listens while music is playing on the deck screen */
async function micSync(){
  const want = micOn && variant === "deck" && !!(spNow && spNow.playing);
  if(want && !micStream && !micBusy){
    micBusy = true;
    const ok = await micStart();
    micBusy = false;
    if(!ok){ micOn = false; store.set("vuMic", false); updateMicButton(); toast("Couldn't use the microphone. Showing simulated needles."); }
    else if(!(micOn && variant === "deck" && spNow && spNow.playing)) micStop();   // things changed while it was starting
  }else if(!want && micStream){
    micStop();
  }
  $("micBtn").classList.toggle("live", !!micStream);
}

function npRender(){
  const connected = !!sp, has = !!spNow, playing = !!(spNow && spNow.playing);
  $("npDlg").classList.toggle("playing", playing);
  const art = has ? (spNow.artBig || spNow.art || "") : "";
  const tapeKey = has ? (spNow.album + "|" + spNow.title) : (connected ? "empty" : "off");
  if(!tapeSwap && (tapeKey !== npTapeKey || art !== npArtShown)){
    const hadTape = npTapeKey !== null && npTapeKey !== "empty" && npTapeKey !== "off";
    if(hadTape && has && tapeKey !== npTapeKey && variant === "deck" && !reduceMotion()) changeTape();
    else applyTape();
  }
  micSync();
  $("npPlay").classList.toggle("latched", playing);
  $("npPause").classList.toggle("latched", has && !playing);
  $("npDlg").querySelectorAll(".key").forEach(k => { k.disabled = !connected && k.id !== "npEject"; });
  plRender();
  npTick();
}

function npTick(){
  let p = 0, pos = 0, dur = 0;
  if(spNow){
    dur = spNow.dur || 0;
    pos = Math.min(spNow.pos + (spNow.playing ? Date.now() - spNow.at : 0), dur || Infinity);
    p = dur ? pos / dur : 0;
  }
  setPack("L", 38 - 16 * p);
  setPack("R", 22 + 16 * p);
  $("npTime").textContent = fmtMs(pos) + " / " + fmtMs(dur);
  if(variant === "player") plProgress();
}

/* ----- VU meters ----- */
function buildVu(svg, label){
  /* the meter face is an image; only the needle is drawn here, clipped so it comes out of the glow at the bottom edge */
  svg.setAttribute("viewBox", "0 0 300 190");
  svg.innerHTML = "";
  const id = "vc" + label;
  const defs = svgEl("defs", {}), cp = svgEl("clipPath", {id});
  cp.append(svgEl("rect", {x:0, y:0, width:300, height:170.2}));
  defs.append(cp); svg.append(defs);
  const outer = svgEl("g", {"clip-path":`url(#${id})`});
  const needle = svgEl("g", {transform:"rotate(-48 150 172)"});
  needle.append(svgEl("line", {x1:152, y1:175, x2:152, y2:62, stroke:"#000", "stroke-opacity":".28", "stroke-width":2.8, "stroke-linecap":"round"}));
  needle.append(svgEl("line", {x1:150, y1:172, x2:150, y2:60, stroke:"#16110d", "stroke-width":2.2, "stroke-linecap":"round"}));
  outer.append(needle); svg.append(outer);
  return needle;
}

const vuNeedle = {}, vu = {l:{pos:0, ref:-40}, r:{pos:0, ref:-40}};
let vuOn = false, vuRaf = 0;
let micOn = store.get("vuMic", false), micStream = null, micCtx = null, anLow = null, anHigh = null, bufLow = null, bufHigh = null;

async function micStart(){
  if(micStream) return true;
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(micCtx.state === "suspended") await micCtx.resume();
    const src = micCtx.createMediaStreamSource(micStream);
    const lp = micCtx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 250;
    const hp = micCtx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 250;
    anLow = micCtx.createAnalyser(); anHigh = micCtx.createAnalyser();
    anLow.fftSize = 1024; anHigh.fftSize = 1024;
    src.connect(lp); lp.connect(anLow); src.connect(hp); hp.connect(anHigh);
    bufLow = new Float32Array(anLow.fftSize); bufHigh = new Float32Array(anHigh.fftSize);
    return true;
  }catch(e){ micStop(); return false; }
}

function micStop(){
  if(micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null; anLow = null; anHigh = null;
  if(micCtx){ micCtx.close().catch(() => {}); micCtx = null; }
}

function rmsDb(an, buf){
  an.getFloatTimeDomainData(buf);
  let s = 0; for(let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  return 20 * Math.log10(Math.sqrt(s / buf.length) || 1e-8);
}

function bandTarget(b, db){
  if(db < -75) return 0;
  b.ref = Math.max(b.ref - 0.012, db, -40);
  return Math.min(1, Math.max(0, ((db - b.ref) + 2 + 20) / 23));
}

function vuFrame(t){
  vuRaf = 0;
  if(!vuOn) return;
  let tl = 0, tr = 0;
  if(micOn && anLow){
    tl = bandTarget(vu.l, rmsDb(anLow, bufLow));
    tr = bandTarget(vu.r, rmsDb(anHigh, bufHigh));
  }else if(spNow && spNow.playing){
    const s = t / 1000;
    tl = .55 + .22 * Math.sin(s * 2.3) + .12 * Math.sin(s * 5.9 + 1) + .06 * Math.sin(s * 13.1);
    tr = .5 + .2 * Math.sin(s * 3.1 + 2) + .14 * Math.sin(s * 7.7) + .07 * Math.sin(s * 15.3 + 1);
  }
  [["l", tl], ["r", tr]].forEach(([k, target]) => {
    const b = vu[k]; target = Math.min(1, Math.max(0, target));
    b.pos += (target - b.pos) * (target > b.pos ? .4 : .07);
    vuNeedle[k].setAttribute("transform", `rotate(${(-48 + b.pos * 96).toFixed(2)} 150 172)`);
    $(k === "l" ? "pkL" : "pkR").classList.toggle("on", b.pos > .88);
  });
  vuRaf = requestAnimationFrame(vuFrame);
}

function updateMicButton(){
  $("micTxt").textContent = micOn ? "MIC" : "SIM";
  $("micBtn").setAttribute("aria-pressed", String(micOn));
}

async function vuStart(){
  vuOn = true;
  updateMicButton(); micSync();
  if(vuOn && !vuRaf) vuRaf = requestAnimationFrame(vuFrame);
}

/* ================= variant 2: Spotify-style player ================= */
let variant = "deck";
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function shade(c, k){
  const m = c && c.match(/\d+/g);
  if(!m) return null;
  return `rgb(${Math.min(255, Math.round(m[0] * k))},${Math.min(255, Math.round(m[1] * k))},${Math.min(255, Math.round(m[2] * k))})`;
}
function setPlayerTint(c){
  const st = $("npDlg").style;
  st.setProperty("--t1", c ? shade(c, 1.05) : "#4a4d57");
  st.setProperty("--t2", c ? shade(c, .42) : "#1c1d22");
}

let plDrag = null;   // fraction while the thumb is being dragged
function plProgress(){
  let frac = 0, pos = 0, dur = 0;
  if(spNow){
    dur = spNow.dur || 0;
    pos = Math.min(spNow.pos + (spNow.playing ? Date.now() - spNow.at : 0), dur || Infinity);
    frac = dur ? pos / dur : 0;
  }
  if(plDrag !== null){ frac = plDrag; pos = frac * dur; }
  $("plFill").style.width = (frac * 100).toFixed(2) + "%";
  $("plThumb").style.left = (frac * 100).toFixed(2) + "%";
  $("plPos").textContent = fmtMs(pos); $("plDur").textContent = fmtMs(dur);
}

function plRender(){
  const connected = !!sp, has = !!spNow, playing = !!(spNow && spNow.playing);
  $("plTitle").textContent = has ? spNow.title : (connected ? "Nothing playing" : "Not connected");
  $("plArtist").textContent = has ? spNow.artist : (connected ? "Start playing in Spotify, or pick a device in settings." : "Open the menu to connect Spotify.");
  $("plDevice").textContent = (has && spNow.device) || (connected ? "Spotify" : "Not connected");
  const art = has ? (spNow.artBig || spNow.art || "") : "";
  $("plArt").style.backgroundImage = art ? `url("${art}")` : "none";
  $("plPlay").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $("plPlay").setAttribute("aria-label", playing ? "Pause" : "Play");
  const shuf = has && !!spNow.shuffle, rep = has ? (spNow.repeat || "off") : "off";
  $("plShuffle").classList.toggle("on", shuf); $("plShuffle").setAttribute("aria-pressed", String(shuf));
  $("plRepeat").classList.toggle("on", rep !== "off"); $("plRepeat").dataset.mode = rep;
  $("plRepeat").setAttribute("aria-label", rep === "track" ? "Repeat one" : rep === "context" ? "Repeat all" : "Repeat off");
  ["plShuffle", "plPrev", "plPlay", "plNext", "plRepeat"].forEach(id => { $(id).disabled = !connected; });
  plProgress();
}

async function spSeek(ms){
  const r = await spApi("PUT", "/me/player/seek?position_ms=" + Math.round(ms));
  if(r.status >= 400 || r.status === 0) spError(r);
  setTimeout(spPoll, 500);
}
async function spShuffle(){
  if(!spNow) return;
  spNow.shuffle = !spNow.shuffle; plRender();
  const r = await spApi("PUT", "/me/player/shuffle?state=" + spNow.shuffle);
  if(r.status >= 400 || r.status === 0) spError(r);
  setTimeout(spPoll, 600);
}
async function spRepeat(){
  if(!spNow) return;
  spNow.repeat = {off:"context", context:"track", track:"off"}[spNow.repeat || "off"] || "off"; plRender();
  const r = await spApi("PUT", "/me/player/repeat?state=" + spNow.repeat);
  if(r.status >= 400 || r.status === 0) spError(r);
  setTimeout(spPoll, 600);
}

function vuStop(){ vuOn = false; if(vuRaf){ cancelAnimationFrame(vuRaf); vuRaf = 0; } }

function setVariant(v){
  variant = v === "player" ? "player" : "deck";
  store.set("variant", variant);
  $("npDlg").classList.toggle("v2", variant === "player");
  $("deck").hidden = variant === "player";
  $("player").hidden = variant !== "player";
  if(variant === "player"){ vuStop(); micStop(); plRender(); }   // the meters and microphone only run on the deck
  else vuStart();
}

/* ================= initialization & deck wiring ================= */
(function metalGrain(){
  const c = document.createElement("canvas"); c.width = c.height = 96;
  const cx = c.getContext("2d"), im = cx.createImageData(96, 96);
  for(let i = 0; i < im.data.length; i += 4){ const v = Math.random() < .5 ? 255 : 0; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = Math.random() * 16; }
  cx.putImageData(im, 0, 0);
  document.documentElement.style.setProperty("--grain", `url(${c.toDataURL("image/png")})`);
})();

vuNeedle.l = buildVu($("vuL"), "LOW");
vuNeedle.r = buildVu($("vuR"), "HIGH");

if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { npTapeKey = null; npRender(); });

$("micBtn").onclick = async () => {
  micOn = !micOn; store.set("vuMic", micOn);
  if(micOn){
    const ok = await micStart();      // ask for permission now, while the person is tapping
    if(!ok){ micOn = false; store.set("vuMic", false); toast("Couldn't use the microphone. Check the permission and try again."); }
  }
  updateMicButton(); micSync();       // it then only listens while music is playing
};

const keyAct = (id, fn) => { $(id).onclick = () => { vib(12); fn(); }; };
keyAct("npPrev", () => spControl("prev"));
keyAct("npNext", () => spControl("next"));
keyAct("npPlay", () => { if(!(spNow && spNow.playing)) spControl("toggle"); });
keyAct("npPause", () => { if(spNow && spNow.playing) spControl("toggle"); });
keyAct("npEject", openSettings);

/* variant switch and the Spotify-style player controls */
$("toPlayer").onclick = () => setVariant("player");
$("plBack").onclick = () => setVariant("deck");
$("plMenu").onclick = openSettings;
keyAct("plPrev", () => spControl("prev"));
keyAct("plNext", () => spControl("next"));
keyAct("plPlay", () => spControl("toggle"));
keyAct("plShuffle", spShuffle);
keyAct("plRepeat", spRepeat);

/* tap or drag the progress bar to seek */
(function(){
  const bar = $("plSeek");
  const frac = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  bar.addEventListener("pointerdown", e => { if(!spNow) return; bar.setPointerCapture(e.pointerId); plDrag = frac(e); plProgress(); });
  bar.addEventListener("pointermove", e => { if(plDrag !== null){ plDrag = frac(e); plProgress(); } });
  bar.addEventListener("pointerup", () => {
    if(plDrag === null) return;
    const f = plDrag; plDrag = null;
    if(spNow){ spNow.pos = f * spNow.dur; spNow.at = Date.now(); spSeek(spNow.pos); }
    plProgress();
  });
  bar.addEventListener("pointercancel", () => { plDrag = null; plProgress(); });
})();


setInterval(spPoll, 5000);
setInterval(npTick, 250);

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(() => {});
npRender();
setVariant(store.get("variant", "deck"));
spHandleRedirect().then(() => { npRender(); refreshSettings(); spPoll(); });
</script>
